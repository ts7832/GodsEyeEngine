<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God's Eye // UNCLASSIFIED</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0f18;
            --panel-bg: rgba(255, 255, 255, 0.015);
            --border-color: #1e293b;
            --text-main: #cbd5e1;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --danger: #f87171;
            --success: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }

        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 15, 24, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .panel-header {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .thesis-card {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .thesis-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            background: rgba(56, 189, 248, 0.05);
        }

        .thesis-card.active {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
        }

        .thesis-title {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            color: var(--accent-blue);
            margin-bottom: 0.25rem;
        }

        .thesis-desc {
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }

        .expansion-area {
            display: none;
            margin-top: 1rem;
            border-top: 1px dashed var(--border-color);
            padding-top: 1rem;
        }

        .thesis-card.active .expansion-area {
            display: block;
        }

        .mermaid-container {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border: 1px solid #1e293b;
            margin-top: 10px;
            text-align: center;
        }

        .tag-container {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tag {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            padding: 2px 6px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .tag.aligned {
            color: var(--success);
            border-color: rgba(52, 211, 153, 0.3);
            background: rgba(52, 211, 153, 0.05);
        }

        .tag.reject {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
            background: rgba(248, 113, 113, 0.05);
        }

        .cio-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            resize: vertical;
            min-height: 150px;
        }

        .cio-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 0.5rem 1rem;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 5px var(--success);
        }
    </style>
</head>
<body>
    <header>
        <h1><span style="color:var(--text-main)">GOD'S EYE</span> // COMMAND CENTER</h1>
        <div style="font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--text-muted);">
            <span class="status-dot"></span> UPLINK SECURE
        </div>
    </header>

    <div class="container">
        <!-- Live Feed Panel -->
        <div class="panel" style="overflow-y: auto; max-height: calc(100vh - 100px);">
            <div class="panel-header">
                <span>Active Intelligence / Theses</span>
                <span id="last-updated">--:--:--</span>
            </div>
            <div id="theses-container">
                <div style="color: var(--text-muted); font-family: 'Roboto Mono', monospace; font-size: 11px;">Awaiting signal intercept...</div>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="panel">
            <div class="panel-header">
                <span id="cio-header">CIO OVERRIDE (GLOBAL)</span>
            </div>
            <p style="color: var(--text-muted); font-size: 11px; margin-bottom: 0.5rem;">
                Click a thesis card to target it, or inject feedback globally into the RAG matrix.
            </p>
            <textarea id="cio-text" class="cio-input" placeholder="> INPUT OVERRIDE COMMAND..."></textarea>
            <div style="display: flex; justify-content: flex-end; margin-top: 0.5rem;">
                <button class="btn" onclick="submitFeedback()">Execute</button>
            </div>
        </div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        let selectedThesisId = null;
        let knownThesesIds = new Set();

        function formatTags(desc) {
            const regex = /\[(.*?)\]/g;
            return desc.replace(regex, (match, tagText) => {
                let className = 'tag';
                if (tagText.includes('ALIGNED')) className += ' aligned';
                else if (tagText.includes('REJECT')) className += ' reject';
                return `<span class="${className}">[${tagText}]</span>`;
            });
        }

        async function fetchGraphs(thesisId, cardElement) {
            const expArea = cardElement.querySelector('.expansion-area');
            if(expArea.innerHTML !== '') return; // Already loaded

            expArea.innerHTML = `<div style="text-align:center; color:var(--accent-blue); font-family:'Roboto Mono', monospace; font-size:11px;">DECRYPTING NODES...</div>`;
            
            try {
                const aRes = await fetch(`/api/assumptions?thesis_id=${thesisId}`);
                const assumptions = await aRes.json();
                
                const sRes = await fetch(`/api/thesis_signals?thesis_id=${thesisId}`);
                const signals = await sRes.json();

                let mermaidGraph = `graph TD\n`;
                mermaidGraph += `classDef thesis fill:#0f172a,stroke:#38bdf8,stroke-width:2px,color:#fff;\n`;
                mermaidGraph += `classDef assumption fill:#1e293b,stroke:#cbd5e1,color:#fff;\n`;
                mermaidGraph += `classDef signal fill:#3f2a14,stroke:#f59e0b,color:#fff;\n`;
                
                mermaidGraph += `T${thesisId}["THESIS #${thesisId}"]:::thesis\n`;
                
                assumptions.forEach(a => {
                    let text = a.description.replace(/"/g, "'");
                    mermaidGraph += `A${a.id}["[ASSUMPTION] ${text}"]:::assumption\n`;
                    mermaidGraph += `A${a.id} --> T${thesisId}\n`;
                });

                signals.forEach(s => {
                    let text = s.content.replace(/"/g, "'");
                    mermaidGraph += `S${s.id}["[SIGNAL: ${s.source}] ${text}"]:::signal\n`;
                    mermaidGraph += `S${s.id} -.-> T${thesisId}\n`;
                });
                
                if(assumptions.length === 0 && signals.length === 0) {
                    expArea.innerHTML = `<div style="font-size:10px; color:var(--text-muted); font-family:'Roboto Mono', monospace;">NO CONNECTED NODES FOUND</div>`;
                    return;
                }

                expArea.innerHTML = `
                    <div style="font-size:11px; color:var(--accent-blue); margin-bottom:5px; font-family:'Roboto Mono', monospace;">[INTEL GRAPH & ASSUMPTION MATRIX]</div>
                    <div class="mermaid-container">
                        <div class="mermaid" id="mer-${thesisId}">${mermaidGraph}</div>
                    </div>
                `;
                
                // Render mermaid inside the block
                setTimeout(() => {
                    mermaid.init(undefined, document.getElementById(`mer-${thesisId}`));
                }, 100);

            } catch(e) {
                expArea.innerHTML = `<div style="color:var(--danger); font-family:'Roboto Mono', monospace;">DECRYPTION FAILED</div>`;
            }
        }

        window.toggleThesis = function(id, element) {
            document.querySelectorAll('.thesis-card').forEach(c => {
                if(c !== element) c.classList.remove('active');
            });
            
            if(element.classList.contains('active')) {
                element.classList.remove('active');
                selectedThesisId = null;
                document.getElementById('cio-header').innerText = `CIO OVERRIDE (GLOBAL)`;
            } else {
                element.classList.add('active');
                selectedThesisId = id;
                document.getElementById('cio-header').innerText = `CIO OVERRIDE // TARGET: THESIS #${id}`;
                fetchGraphs(id, element);
            }
        };

        async function submitFeedback() {
            const input = document.getElementById('cio-text').value;
            if(!input) return;
            
            const payload = {
                thesis_id: selectedThesisId,
                feedback_text: input
            };
            
            const btn = document.querySelector('.btn');
            btn.innerText = 'EXECUTING...';
            
            try {
                await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('cio-text').value = '';
                btn.innerText = 'SUCCESS';
                setTimeout(() => btn.innerText = 'EXECUTE', 2000);
            } catch(e) {
                console.error(e);
                btn.innerText = 'ERROR';
                setTimeout(() => btn.innerText = 'EXECUTE', 2000);
            }
        }

        async function fetchTheses() {
            try {
                const response = await fetch('/api/theses');
                const theses = await response.json();
                
                const container = document.getElementById('theses-container');
                if (theses.length === 0) {
                    if (knownThesesIds.size === 0) {
                        container.innerHTML = `<div style="color: var(--text-muted); font-family: 'Roboto Mono', monospace; font-size: 11px;">Awaiting signal intercept...</div>`;
                    }
                    return;
                }

                if (knownThesesIds.size === 0) container.innerHTML = ''; // clear initial

                theses.forEach(t => {
                    if(!knownThesesIds.has(t.id)) {
                        knownThesesIds.add(t.id);
                        let cleanDesc = t.description;
                        let formattedHTML = formatTags(cleanDesc);

                        const card = document.createElement('div');
                        card.className = 'thesis-card';
                        card.setAttribute('onclick', `toggleThesis(${t.id}, this)`);
                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                <div class="thesis-title">THESIS #${t.id}</div>
                                <div style="font-family: 'Roboto Mono', monospace; font-size: 10px; color: ${t.status === 'ACTIVE' ? 'var(--success)' : 'var(--danger)'}">
                                    [${t.status}]
                                </div>
                            </div>
                            <div class="thesis-desc">${formattedHTML.replace(/\n/g, '<br>')}</div>
                            <div class="expansion-area"></div>
                        `;
                        container.insertBefore(card, container.firstChild);
                    }
                });

                document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Failed to fetch theses", error);
            }
        }

        setInterval(fetchTheses, 5000);
        fetchTheses();
    </script>
</body>
</html>
