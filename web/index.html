<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God's Eye // COMMAND CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0f18;
            --panel-bg: rgba(255, 255, 255, 0.015);
            --border-color: #1e293b;
            --text-main: #cbd5e1;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-gold: #fbbf24;
            --danger: #f87171;
            --success: #34d399;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; font-size: 13px; overflow: hidden; }

        header { padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); background: rgba(10, 15, 24, 0.9); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }

        .header-controls { display: flex; align-items: center; gap: 1rem; font-family: 'Roboto Mono', monospace; font-size: 11px; }
        .timer-text { color: var(--text-muted); }

        .container { display: grid; grid-template-columns: 1fr 400px; gap: 1rem; padding: 1rem; flex: 1; overflow: hidden; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 1rem; display: flex; flex-direction: column; overflow: hidden; }

        .panel-header { font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;}

        /* Tabs */
        .tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .tab { font-family: 'Roboto Mono', monospace; font-size: 12px; color: var(--text-muted); cursor: pointer; text-transform: uppercase; }
        .tab.active { color: var(--accent-blue); font-weight: 700; border-bottom: 2px solid var(--accent-blue); padding-bottom: 0.5rem; margin-bottom: -0.6rem; }
        
        .sub-filters { display: none; gap: 10px; margin-bottom: 10px; }
        .sub-filters.active { display: flex; }

        /* Thesis List */
        .thesis-list { overflow-y: auto; flex: 1; display: none; }
        .thesis-list.active { display: block; }

        /* Compact Card */
        .thesis-card { border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; background: rgba(0, 0, 0, 0.3); margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .thesis-card:hover { border-color: rgba(56, 189, 248, 0.5); background: rgba(56, 189, 248, 0.05); }
        .thesis-card.active { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.1); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Roboto Mono', monospace; margin-bottom: 4px; }
        .card-title { color: var(--accent-blue); font-size: 12px; font-weight: bold; }
        .card-metrics { display: flex; gap: 8px; font-size: 10px; align-items: center; }
        .metric { border: 1px solid var(--border-color); padding: 2px 4px; color: var(--text-muted); }
        .metric.alpha { color: var(--accent-gold); border-color: rgba(251, 191, 36, 0.3); }
        .metric.pnl { font-weight: bold; }
        .metric.pnl.green { color: var(--success); }
        .metric.pnl.red { color: var(--danger); }
        .icon { font-size: 12px; }

        /* Expanded Area */
        .card-body { display: none; margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 10px; font-size: 12px; line-height: 1.4; color: var(--text-main); }
        .thesis-card.active .card-body { display: block; }

        .action-row { display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); }

        /* CIO Override */
        .cio-input { width: 100%; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem; font-family: 'Roboto Mono', monospace; font-size: 12px; resize: vertical; min-height: 150px; }
        .cio-input:focus { outline: none; border-color: var(--accent-blue); }

        .btn { background: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 0.4rem 0.8rem; font-family: 'Roboto Mono', monospace; font-size: 10px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: rgba(56, 189, 248, 0.1); }
        .btn.scrape { color: var(--danger); border-color: var(--danger); }
        .btn.scrape:hover { background: rgba(248, 113, 113, 0.1); }
        .btn.star { color: var(--accent-gold); border-color: var(--accent-gold); }
        .btn.star:hover { background: rgba(251, 191, 36, 0.1); }

        .mermaid-container { background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid #1e293b; margin-top: 10px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
        .mermaid-container:hover { border-color: var(--accent-blue); }
        .graph-title { font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--text-muted); text-align: left; margin-bottom: 5px; }
        .tag { font-family: 'Roboto Mono', monospace; font-size: 9px; padding: 2px 4px; border: 1px solid var(--border-color); color: var(--text-muted); margin-right: 4px; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 9999; }
        .modal-overlay.active { display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .modal-close { position: absolute; top: 20px; right: 20px; color: var(--accent-blue); cursor: pointer; font-family: 'Roboto Mono', monospace; border: 1px solid var(--accent-blue); padding: 5px 10px; background: #000; z-index: 10000; }
        .modal-close:hover { background: rgba(56, 189, 248, 0.1); }
        .modal-content { width: 95vw; height: 90vh; background: #0a0f18; border: 1px solid var(--accent-blue); position: relative; }
    </style>
</head>
<body>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-close" onclick="closeModal()">[X] CLOSE</div>
        <div id="modal-content" class="modal-content"></div>
        <div id="details-panel" style="display:none; position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:80%; max-width:800px; max-height:300px; overflow-y:auto; background:rgba(15,23,42,0.95); border:1px solid var(--accent-blue); color:var(--text-main); padding:20px; font-family:'Inter', sans-serif; font-size:14px; z-index:10001; text-align:left; box-shadow: 0 0 20px rgba(0,0,0,0.8);"></div>
    </div>

    <header>
        <h1><span style="color:var(--text-main)">GOD'S EYE</span> // COMMAND CENTER</h1>
        <div class="header-controls">
            <span class="timer-text" id="timer">LAST SCRAPE: CHECKING...</span>
            <button class="btn scrape" onclick="triggerScrape()">[INITIATE SCRAPE]</button>
            <button class="btn" style="color: var(--text-muted); border-color: var(--text-muted);" onclick="viewLogs()">[VIEW LOGS]</button>
        </div>
    </header>

    <div class="container">
        <!-- Left Panel: Lists -->
        <div class="panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('raw')">RAW INTERCEPTS</div>
                <div class="tab" onclick="switchTab('watchlist')">WATCHLIST</div>
            </div>
            
            <div class="sub-filters" id="watchlist-filters">
                <button class="btn active" id="btn-show-all" onclick="setWatchlistFilter('all')">ALL TRACKED</button>
                <button class="btn" id="btn-show-starred" onclick="setWatchlistFilter('starred')">OPEN POSITIONS [*]</button>
            </div>

            <div id="list-raw" class="thesis-list active"></div>
            <div id="list-watchlist" class="thesis-list"></div>
        </div>

        <!-- Right Panel: CIO Override -->
        <div class="panel">
            <div class="panel-header">
                <span id="cio-header">CIO OVERRIDE (GLOBAL)</span>
            </div>
            <textarea id="cio-text" class="cio-input" placeholder="> INPUT OVERRIDE COMMAND..."></textarea>
            <div style="display: flex; justify-content: flex-end; margin-top: 0.5rem;">
                <button class="btn" onclick="submitFeedback()">Execute</button>
            </div>
        </div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        let currentTab = 'raw';
        let watchlistFilter = 'all'; // 'all' or 'starred'
        let selectedThesisId = null;
        let lastScrapeTs = 0;
        let thesesData = [];
        window.nodeTextMap = {};

        function showNodeDetails(nodeIdOrText, isRawText = false) {
            const fullText = isRawText ? nodeIdOrText : (window.nodeTextMap[nodeIdOrText] || "No details available.");
            const panel = document.getElementById('details-panel');
            panel.innerText = fullText;
            panel.style.display = 'block';
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.thesis-list').forEach(l => l.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`list-${tabName}`).classList.add('active');
            
            document.getElementById('watchlist-filters').classList.toggle('active', tabName === 'watchlist');
            renderLists();
        }

        function setWatchlistFilter(filter) {
            watchlistFilter = filter;
            document.getElementById('btn-show-all').style.borderColor = filter === 'all' ? 'var(--accent-blue)' : 'var(--border-color)';
            document.getElementById('btn-show-starred').style.borderColor = filter === 'starred' ? 'var(--accent-blue)' : 'var(--border-color)';
            renderLists();
        }

        async function triggerScrape() {
            const btn = document.querySelector('.btn.scrape');
            btn.innerText = '[SCRAPING IN BACKGROUND...]';
            await fetch('/api/trigger_scrape', { method: 'POST' });
            setTimeout(() => { btn.innerText = '[INITIATE SCRAPE]'; updateTimer(); fetchTheses(); }, 30000);
        }

        async function viewLogs() {
            try {
                const res = await fetch('/api/logs');
                if (!res.ok) throw new Error("Server returned " + res.status);
                const data = await res.json();
                alert(`DATABASE STATUS: ${data.db_status}\n\nSCRAPE LOGS:\n${data.scrape_logs.substring(0, 1000)}...`);
            } catch(e) {
                alert("Failed to fetch logs. Error: " + e.message);
            }
        }

        async function updateTimer() {
            try {
                const res = await fetch('/api/last_scrape');
                const data = await res.json();
                lastScrapeTs = data.last_scrape_ts;
            } catch(e) {}
        }

        setInterval(() => {
            if(lastScrapeTs === 0) {
                document.getElementById('timer').innerText = `LAST SCRAPE: NEVER`;
                return;
            }
            const diffSeconds = Math.floor(Date.now() / 1000) - lastScrapeTs;
            const h = Math.floor(diffSeconds / 3600);
            const m = Math.floor((diffSeconds % 3600) / 60);
            document.getElementById('timer').innerText = `LAST SCRAPE: ${h}H ${m}M AGO`;
        }, 1000);

        async function actionTrack(id) {
            await fetch('/api/track', { method: 'POST', body: JSON.stringify({ thesis_id: id, is_tracked: 1 }) });
            fetchTheses();
        }

        async function actionStar(id) {
            await fetch('/api/star', { method: 'POST', body: JSON.stringify({ thesis_id: id, is_starred: 1 }) });
            fetchTheses();
        }

        async function actionUntrack(id) {
            await fetch('/api/track', { method: 'POST', body: JSON.stringify({ thesis_id: id, is_tracked: 0 }) });
            fetchTheses();
        }

        async function actionUnstar(id) {
            await fetch('/api/star', { method: 'POST', body: JSON.stringify({ thesis_id: id, is_starred: 0 }) });
            fetchTheses();
        }

        function toggleCard(id, element) {
            const isActive = element.classList.contains('active');
            document.querySelectorAll('.thesis-card').forEach(c => c.classList.remove('active'));
            
            if(isActive) {
                selectedThesisId = null;
                document.getElementById('cio-header').innerText = `CIO OVERRIDE (GLOBAL)`;
            } else {
                element.classList.add('active');
                selectedThesisId = id;
                document.getElementById('cio-header').innerText = `CIO OVERRIDE // TARGET: THESIS #${id}`;
                fetchGraphs(id, element);
            }
        }

        async function fetchGraphs(thesisId, cardElement) {
            const bodyArea = cardElement.querySelector('.card-body');
            const actionRow = bodyArea.querySelector('.action-row');
            if(bodyArea.querySelector('.mermaid-container')) return; // Already loaded

            try {
                const aRes = await fetch(`/api/assumptions?thesis_id=${thesisId}`);
                const assumptions = await aRes.json();
                
                const sRes = await fetch(`/api/thesis_signals?thesis_id=${thesisId}`);
                const signals = await sRes.json();

                let styleDefs = `%%{init: {"flowchart": {"curve": "step"}}}%%\n` +
                                `classDef thesis fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff;\n` +
                                `classDef neutral fill:#1e293b,stroke:#64748b,color:#fff;\n` +
                                `classDef strengthened fill:#064e3b,stroke:#34d399,color:#fff;\n` +
                                `classDef weakened fill:#7f1d1d,stroke:#f87171,color:#fff;\n` +
                                `classDef signal fill:#3f2a14,stroke:#f59e0b,color:#fff;\n` +
                                `classDef joint fill:#38bdf8,stroke:none,color:transparent;\n` +
                                `linkStyle default stroke:#38bdf8,stroke-width:2px;\n`;

                let signalsGraph = `graph TD\n${styleDefs}`;
                signalsGraph += `T${thesisId}["THESIS #${thesisId}"]:::thesis\n`;
                signals.forEach(s => {
                    let text = s.content.replace(/"/g, "'").replace(/\n/g, ' ');
                    let shortText = text.split(' ').slice(0, 5).join(' ') + '...';
                    let displayLabel = `[SIGNAL] ${shortText}`;
                    window.nodeTextMap[displayLabel] = text;
                    let nodeId = `S${s.id}`;
                    signalsGraph += `${nodeId}["${displayLabel}"]:::signal\n`;
                    signalsGraph += `${nodeId} --- T${thesisId}\n`;
                });

                let assumpGraph = `graph TD\n${styleDefs}`;
                assumpGraph += `T${thesisId}["THESIS #${thesisId}"]:::thesis\n`;
                if (assumptions.length > 0) {
                    assumpGraph += `J_A${thesisId}((" ")):::joint\n`;
                    assumpGraph += `J_A${thesisId} --- T${thesisId}\n`;
                }
                assumptions.forEach(a => {
                    let text = a.description.replace(/"/g, "'").replace(/\n/g, ' ');
                    let shortText = text.split(' ').slice(0, 5).join(' ') + '...';
                    let statusClass = "neutral";
                    if(a.status === 'STRENGTHENED') statusClass = "strengthened";
                    if(a.status === 'WEAKENED') statusClass = "weakened";
                    let displayLabel = `[${a.status}] ${shortText}`;
                    window.nodeTextMap[displayLabel] = text;
                    let nodeId = `A${a.id}`;
                    assumpGraph += `${nodeId}["${displayLabel}"]:::${statusClass}\n`;
                    assumpGraph += `${nodeId} --- J_A${thesisId}\n`;
                });

                const container = document.createElement('div');
                container.innerHTML = `
                    <div class="mermaid-container" onclick="openModal('mer-sig-${thesisId}')">
                        <div class="graph-title">/// SIGNALS MAP [CLICK TO EXPAND]</div>
                        <div class="mermaid" id="mer-sig-${thesisId}">${signalsGraph}</div>
                    </div>
                    <div class="mermaid-container" onclick="openModal('mer-assump-${thesisId}')">
                        <div class="graph-title">/// ASSUMPTIONS MAP [CLICK TO EXPAND]</div>
                        <div class="mermaid" id="mer-assump-${thesisId}">${assumpGraph}</div>
                    </div>
                `;
                bodyArea.insertBefore(container, actionRow);
                
                setTimeout(() => {
                    mermaid.init(undefined, document.getElementById(`mer-sig-${thesisId}`));
                    mermaid.init(undefined, document.getElementById(`mer-assump-${thesisId}`));
                    
                    // Secretly stitch SVG lines to mathematically guarantee a perfect manifold
                    setTimeout(() => {
                        document.querySelectorAll('.mermaid').forEach(svgContainer => {
                            // Find the thesis node
                            const thesisNode = Array.from(svgContainer.querySelectorAll('.node')).find(n => n.id.includes('flowchart-T'));
                            if(!thesisNode) return;

                            // Find all signal/assumption nodes
                            const inputNodes = Array.from(svgContainer.querySelectorAll('.node')).filter(n => {
                                return n.id.match(/flowchart-[AS]\d+-/);
                            });

                            if (inputNodes.length > 0) {
                                // Hide joint node
                                const joint = Array.from(svgContainer.querySelectorAll('.node.joint'))[0];
                                if (joint) joint.style.display = 'none';

                                // Hide all default dagre edges completely
                                const edgePathsGroup = svgContainer.querySelector('.edgePaths');
                                if (edgePathsGroup) edgePathsGroup.style.display = 'none';

                                // Extract coords
                                let coords = inputNodes.map(node => {
                                    const match = node.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                                    if(!match) return null;
                                    const rect = node.querySelector('rect') || node.querySelector('foreignObject');
                                    let h = 0;
                                    if(rect) h = parseFloat(rect.getAttribute('height') || 0);
                                    return { x: parseFloat(match[1]), y: parseFloat(match[2]), h: h };
                                }).filter(c => c !== null);

                                const tMatch = thesisNode.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                                const tRect = thesisNode.querySelector('rect');
                                const tCoord = {
                                    x: parseFloat(tMatch[1]),
                                    y: parseFloat(tMatch[2]),
                                    h: parseFloat(tRect.getAttribute('height'))
                                };

                                if(coords.length > 0 && tMatch) {
                                    let maxBottom = Math.max(...coords.map(c => c.y + c.h/2));
                                    let tTop = tCoord.y - tCoord.h/2;
                                    
                                    // If there is only 1 node (like Signals), route straight down. 
                                    // If there are multiple (like Assumptions), draw the manifold horizontal bar.
                                    let manifoldY = coords.length === 1 ? null : (maxBottom + tTop) / 2;

                                    let d = "";
                                    if (coords.length === 1) {
                                        d += `M ${coords[0].x} ${coords[0].y + coords[0].h/2} L ${tCoord.x} ${tTop}`;
                                    } else {
                                        // Vertical lines from nodes to manifold
                                        coords.forEach(c => {
                                            d += `M ${c.x} ${c.y + c.h/2} L ${c.x} ${manifoldY} `;
                                        });

                                        // Horizontal line
                                        let minX = Math.min(...coords.map(c => c.x));
                                        let maxX = Math.max(...coords.map(c => c.x));
                                        d += `M ${minX} ${manifoldY} L ${maxX} ${manifoldY} `;

                                        // Vertical line down to Thesis
                                        d += `M ${tCoord.x} ${manifoldY} L ${tCoord.x} ${tTop} `;
                                    }

                                    const newPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                                    newPath.setAttribute('d', d);
                                    newPath.setAttribute('style', 'fill:none; stroke:#38bdf8; stroke-width:2px;');
                                    
                                    if(edgePathsGroup) {
                                        edgePathsGroup.parentNode.insertBefore(newPath, edgePathsGroup.nextSibling);
                                    }
                                }
                            }
                        });
                    }, 100);
                }, 100);

            } catch(e) {
                console.error(e);
            }
        }

        function openModal(graphId) {
            event.stopPropagation();
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            const originalSvg = document.querySelector(`#${graphId} svg`);
            if(!originalSvg) return;
            
            content.innerHTML = '';
            const clonedSvg = originalSvg.cloneNode(true);
            clonedSvg.style.width = '100%';
            clonedSvg.style.height = '100%';
            clonedSvg.style.maxWidth = 'none';
            clonedSvg.id = 'fullscreen-svg';
            content.appendChild(clonedSvg);

            // Re-attach click listeners since cloneNode doesn't copy them
            clonedSvg.querySelectorAll('.node').forEach(node => {
                node.style.cursor = 'pointer';
                node.onclick = function(e) {
                    const textSpan = node.querySelector('.nodeLabel') || node.querySelector('foreignObject');
                    let clickedText = textSpan ? textSpan.textContent.trim() : node.textContent.trim();
                    
                    // Loose matching to handle newlines and spaces
                    let foundText = "No details available.";
                    for (let shortT in window.nodeTextMap) {
                        if (clickedText.includes(shortT) || shortT.includes(clickedText) || clickedText === shortT) {
                            foundText = window.nodeTextMap[shortT];
                            break;
                        }
                    }
                    showNodeDetails(foundText, true);
                };
            });
            
            overlay.classList.add('active');
            
            setTimeout(() => {
                window.panZoomInstance = svgPanZoom('#fullscreen-svg', {
                    zoomEnabled: true,
                    controlIconsEnabled: true,
                    fit: true,
                    center: true,
                    minZoom: 0.1
                });
            }, 100);
        }

        function closeModal() {
            if(window.panZoomInstance) {
                window.panZoomInstance.destroy();
                window.panZoomInstance = null;
            }
            document.getElementById('modal-overlay').classList.remove('active');
            document.getElementById('details-panel').style.display = 'none';
        }

        function createCardHTML(t) {
            let pnlHtml = '';
            if (t.is_starred && t.pnl_percentage !== null && t.pnl_percentage !== undefined) {
                let colorClass = t.pnl_percentage >= 0 ? 'green' : 'red';
                let sign = t.pnl_percentage >= 0 ? '+' : '';
                pnlHtml = `<span class="metric pnl ${colorClass}">${sign}${t.pnl_percentage.toFixed(2)}%</span>`;
            }

            let icons = [];
            if (t.is_tracked) icons.push('<span style="color:var(--accent-blue)">[TRK]</span>');
            if (t.is_starred) icons.push('<span style="color:var(--accent-gold)">[LCK]</span>');

            let descPreview = t.description.split('\n')[0];
            let displayTitle = t.title || '[UNCLASSIFIED ASSET]';
            
            let buttons = '';
            if (!t.is_tracked) {
                buttons = `<button class="btn" onclick="event.stopPropagation(); actionTrack(${t.id})">[O] TRACK THESIS</button>`;
            } else {
                buttons += `<button class="btn" onclick="event.stopPropagation(); actionUntrack(${t.id})">[X] UNTRACK</button> `;
                if (!t.is_starred) {
                    buttons += `<button class="btn star" onclick="event.stopPropagation(); actionStar(${t.id})">[*] LOCK TARGET</button>`;
                } else {
                    buttons += `<button class="btn" style="color:var(--danger);border-color:var(--danger);" onclick="event.stopPropagation(); actionUnstar(${t.id})">[-] UNLOCK TARGET</button>`;
                }
            }

            // Restore active state and body content if this card was open before refresh
            let activeClass = '';
            let bodyContent = `<div style="margin-bottom: 10px;">${t.description.replace(/\n/g, '<br>')}</div>`;
            
            if (selectedThesisId === t.id && window.savedActiveBody) {
                activeClass = 'active';
                bodyContent = window.savedActiveBody;
            }
            
            return `
                <div class="thesis-card ${activeClass}" id="card-${t.id}" onclick="toggleCard(${t.id}, this)">
                    <div class="card-header">
                        <div class="card-title">${displayTitle} ${icons.join(' ')}</div>
                        <div class="card-metrics">
                            <span class="metric">${t.target_instrument || 'UNKNOWN'} [${t.position_type || 'UNKNOWN'}]</span>
                            <span class="metric alpha">ALPHA: ${t.alpha_score || 0}</span>
                            ${pnlHtml}
                        </div>
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        ${descPreview}
                    </div>
                    
                    <div class="card-body">
                        ${bodyContent}
                        <div class="action-row">
                            ${buttons}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLists() {
            // Save active body before clearing
            if (selectedThesisId) {
                const activeCard = document.querySelector(`.thesis-card#card-${selectedThesisId}`);
                if (activeCard) {
                    let bodyHtml = activeCard.querySelector('.card-body').innerHTML;
                    // Strip the action row out, as it gets rebuilt by createCardHTML
                    bodyHtml = bodyHtml.replace(/<div class="action-row">[\s\S]*?<\/div>/, '');
                    window.savedActiveBody = bodyHtml;
                } else {
                    window.savedActiveBody = null;
                }
            }

            const rawContainer = document.getElementById('list-raw');
            const watchContainer = document.getElementById('list-watchlist');
            
            rawContainer.innerHTML = '';
            watchContainer.innerHTML = '';

            let rawCards = [];
            let watchCards = [];

            thesesData.forEach(t => {
                if(t.is_tracked) {
                    if (watchlistFilter === 'all' || (watchlistFilter === 'starred' && t.is_starred)) {
                        watchCards.push(t);
                    }
                } else {
                    rawCards.push(t);
                }
            });

            // Sort watchlist by Alpha Score
            watchCards.sort((a, b) => (b.alpha_score || 0) - (a.alpha_score || 0));

            rawCards.forEach(t => rawContainer.innerHTML += createCardHTML(t));
            watchCards.forEach(t => watchContainer.innerHTML += createCardHTML(t));
        }

        async function fetchTheses() {
            try {
                const response = await fetch('/api/theses');
                thesesData = await response.json();
                renderLists();
            } catch (error) {
                console.error("Failed to fetch theses", error);
            }
        }

        async function submitFeedback() {
            const input = document.getElementById('cio-text').value;
            if(!input) return;
            
            const payload = { thesis_id: selectedThesisId, feedback_text: input };
            const btn = document.querySelector('.panel .btn');
            btn.innerText = 'EXECUTING...';
            
            try {
                await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('cio-text').value = '';
                btn.innerText = 'SUCCESS';
                setTimeout(() => btn.innerText = 'EXECUTE', 2000);
            } catch(e) {
                btn.innerText = 'ERROR';
                setTimeout(() => btn.innerText = 'EXECUTE', 2000);
            }
        }

        updateTimer();
        setInterval(updateTimer, 60000); // Check timestamp every minute
        setInterval(fetchTheses, 5000);
        fetchTheses();
    </script>
</body>
</html>
